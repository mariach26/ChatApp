<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Chat App</h1>
        <div id="chat"
             class="border rounded p-3 mb-3"
            style="height: 300px; overflow-y: auto;">
        </div>
        <div class="input-group mb-3">
            <input id="senderInput" type="text" class="form-control"
                placeholder="Your name..."/>
        </div>


        <div class="input-group mb-3">
            <input id="messageInput" type="text" class="form-control"
                   placeholder="Type a message..."/>
            <div id="input-group-append">
                <button id="sendMessage" class="btn-primary">Send</button>
            </div>
        </div>

    </div>
</body>
<script>
    let stompClient=null;
    let hasJoined = false;

    function setConnected(connected){
        document.getElementById('sendMessage').disabled= !connected;
    }
    function connect() {
        let socket = new SockJS('http://localhost:8080/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            })
        })
    }

        function showMessage(message) {
            var chat = document.getElementById('chat');
            var messageElement = document.createElement('div');
            if (message.type == 'JOIN'){
                messageElement.className = "text-center text-muted small fst-italic mb-2 mt-2";
                messageElement.textContent = message.sender + " joined the chat!";
            } else {
                messageElement.className = "border-bottom mb-1";
                messageElement.textContent = message.sender + ': ' + message.content;
            }

            chat.appendChild(messageElement)
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage(message) {
            if (!stompClient) return;

            var sender = document.getElementById('senderInput').value;
            var content = document.getElementById('messageInput').value;
            if (!sender) {
                alert("Please insert name first");
                return;
            }
            if (!hasJoined) {
                var joinMessage = { sender: sender, type: 'JOIN' };
                stompClient.send("/app/sendMessage", {}, JSON.stringify(joinMessage));
                hasJoined = true;
                document.getElementById('senderInput').disabled = true; //kleidwma onomatos, den allazei
            }
            if (content.trim !==""){
                var chatMessage = {
                    sender: sender,
                    content: content
                };
                stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
                document.getElementById('messageInput').value = '';
            }
        }
    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>
</html>
